<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="Calculator.css">
</head>
<body>
    <h1>Calculator</h1>
    <div class="calculator">
        
            <div class="display">
                <p id="display">0</p>
            </div>
            <div class="buttons">
            <div class="button clear " id="all-clear">AC</div>
            <div class="button oprator" >(</div>
            <div class="button oprator" id="percentage">)</div>
            <div class="button oprator" id="divide">/</div>
            <div class="button number" >7</div>
            <div class="button number">8</div>
            <div class="button number">9</div>
            <div class="button oprator" id="multiple">*</div>
            <div class="button number" >4</div>
            <div class="button number">5</div>
            <div class="button number">6</div>
            <div class="button oprator" id="subtract">-</div>
            <div class="button number">1</div>
            <div class="button number">2</div>
            <div class="button number">3</div>
            <div class="button oprator" id="add">+</div>
            <div class="button number" >0</div>
            <div class="button number">.</div>
            <div class="button clear" id="clear">C</div>
            <div class="button oprator" id="equal">=</div></div>
        </div>
    </div>
  <script src="Calculator.js"></script>  
</body>
</html>
